name: release
on:
  push:
    tags:
      - v*
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }} -p agent-memory
      - run: cargo test --locked --release --target ${{ matrix.target }} -p agent-memory --test phase0_acceptance
      - uses: actions/upload-artifact@v4
        with:
          name: agent-memory-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/agent-memory
