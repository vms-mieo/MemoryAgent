[workspace]
members = [
    "crates/lam-core",
    "crates/lam-config",
    "crates/lam-storage",
    "crates/lam-adapters",
    "crates/lam-providers",
    "crates/lam-consolidate",
    "crates/lam-vault",
    "crates/lam-retrieval",
    "apps/agent-memory",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = { version = "0.8", features = ["parse", "display"] }
clap = { version = "4.5", features = ["derive", "env"] }
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
thiserror = "2.0"
tempfile = "3.10"
blake3 = "1.5"
ureq = "2.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }
rmcp = { version = "3.8", features = ["server", "transport-io", "schemars"] }
schemars = "1"
ignore = "0.4"
toml_edit = "0.22"
serde_yaml = "0.9"

[profile.release]
lto = true
codegen-units = 1
strip = true
